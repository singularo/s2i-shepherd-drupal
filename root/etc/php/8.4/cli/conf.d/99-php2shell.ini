; Stopgap for php2shell (CVE-2026-109618 / CVE-2026-109619).
; The session upload progress handler has a use-after-free reachable with
; default settings. Drupal core does not use upload progress, so turning it
; off costs nothing. This does NOT cover the second bug in the multipart
; parser; that needs the patched PHP package. Remove once PHP is patched.
session.upload_progress.enabled = Off
