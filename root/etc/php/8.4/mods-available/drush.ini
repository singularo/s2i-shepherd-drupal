allow_url_fopen = on

apc.shm_size = 128M
apc.ttl = 86400
apc.slam_defense = 0

error_log = /dev/stderr
log_errors = on

max_input_vars = 2000
memory_limit = -1

opcache.memory_consumption = 128
opcache.interned_strings_buffer = 8
opcache.max_accelerated_files = 30000
opcache.revalidate_freq = 60
opcache.enable_cli = 1

post_max_size = 30M

upload_max_filesize = 30M
